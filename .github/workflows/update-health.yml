name: Update check health

# Daily check that servers can still find updates - fails (and GitHub emails you) when:
#  - the Modrinth URL the plugins use stops answering 200 directly (a renamed slug did this
#    silently for every version up to 1.1.8), or
#  - the latest GitHub release is newer than the latest release on Modrinth, so servers would
#    never be told about it (1.1.9 was GitHub-only for two months).

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: vanishpp-common

      - name: Check Modrinth and GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          src=vanishpp-common/src/main/java/net/thecommandcraft/vanishpp/common/update/UpdateSources.java
          id="$(grep -oP 'MODRINTH_PROJECT_ID = "\K[^"]+' "$src")"
          ua="TheCommandCraft/Vanishpp update-health workflow"
          github="$(gh release view --json tagName --jq .tagName)"
          github="${github#v}"
          echo "Latest GitHub release: $github"
          fail=0
          for loader in paper velocity; do
            # same URL the plugins request (UpdateSources.modrinthVersionsUrl), without following redirects
            url="https://api.modrinth.com/v2/project/$id/version?loaders=%5B%22$loader%22%5D"
            code="$(curl -s -o versions.json -w '%{http_code}' -A "$ua" "$url")"
            if [ "$code" != 200 ]; then
              echo "::error::Modrinth answered HTTP $code for the $loader update check ($url). Servers fall back to GitHub for now, but fix UpdateSources."
              fail=1
              continue
            fi
            modrinth="$(jq -r '[.[] | select(.version_type == "release")][0].version_number // empty' versions.json)"
            echo "Latest $loader release on Modrinth: ${modrinth:-none}"
            newest="$(printf '%s\n%s\n' "$modrinth" "$github" | sort -V | tail -1)"
            if [ "$modrinth" != "$github" ] && [ "$newest" = "$github" ]; then
              echo "::error::GitHub release $github isn't on Modrinth for $loader (latest there: ${modrinth:-none}). Servers won't be told about it - publish it with the Release workflow."
              fail=1
            fi
          done
          exit $fail
