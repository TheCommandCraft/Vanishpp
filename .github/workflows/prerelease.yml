name: Tag Prerelease

on:
  workflow_run:
    workflows: ["Build and Upload Artifacts"]
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Verify this run was triggered by an actual version tag
        id: check-tag
        run: |
          ref="${{ github.event.workflow_run.head_branch }}"
          # Only real semver tags like v1.2.3 or v1.2.3-beta should cut a pre-release.
          # `startsWith(head_branch, 'v')` alone would also match ordinary branches
          # such as "v-experiment", so validate the full pattern here instead.
          if [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$ ]]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: '$ref' is not a version tag, not cutting a pre-release."
          fi

      - name: Download all artifacts from build workflow
        if: steps.check-tag.outputs.is_tag == 'true'
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ github.event.workflow_run.head_sha }}
          path: downloaded-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded files (for debugging)
        if: steps.check-tag.outputs.is_tag == 'true'
        run: ls -R downloaded-artifacts

      - name: Remove non-distributable jar byproducts
        # softprops/action-gh-release's `files:` glob has no support for `!`
        # exclusion (each line is matched independently and concatenated) -
        # it silently no-ops rather than filtering, so unwanted jars have to
        # be removed from disk before the release step instead.
        if: steps.check-tag.outputs.is_tag == 'true'
        run: |
          find downloaded-artifacts -type f \( -name 'original-*.jar' -o -name '*-sources.jar' -o -name '*-javadoc.jar' \) -print -delete

      - name: Checkout tagged commit (for release notes)
        if: steps.check-tag.outputs.is_tag == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: src
          sparse-checkout: |
            .github
            CHANGELOG.md

      - name: Build release notes
        # Support-on-Modrinth header (.github/release-note-header.md, edit it there)
        # followed by every CHANGELOG.md section for this version, if there is one.
        if: steps.check-tag.outputs.is_tag == 'true'
        run: |
          set -euo pipefail
          tag="${{ github.event.workflow_run.head_branch }}"
          version="$(printf '%s' "${tag#v}" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')"
          {
            cat src/.github/release-note-header.md
            awk -v v="$version" '/^## \[/ { p = index($0, "## [" v "]") == 1 } p' src/CHANGELOG.md
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Pre-release
        if: steps.check-tag.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          name: "Pre-release ${{ github.event.workflow_run.head_branch }}"
          body_path: release-notes.md
          draft: false
          prerelease: true
          files: downloaded-artifacts/**/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
